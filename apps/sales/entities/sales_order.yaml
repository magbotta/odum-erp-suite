entity: SalesOrder
app: sales
fields:
  - {name: so_number, type: string, label: "SO #", read_only: true}
  - {name: customer, type: link, target: Customer, required: true}
  - {name: posting_date, type: date, required: true}
  - {name: delivery_date, type: date}
  - {name: currency, type: string, default: USD}
  - {name: exchange_rate, type: float, default: 1}
  - {name: discount_amount, type: currency, default: 0}
  - {name: net_total, type: currency, read_only: true}
  - {name: tax_total, type: currency, read_only: true}
  - {name: grand_total, type: currency, read_only: true}
  - {name: status, type: select, options: [draft, submitted, processing, partially_delivered, delivered, billed, cancelled], default: draft}
  - {name: credit_limit_exceeded, type: boolean, default: false, read_only: true}
  - {name: opportunity_id, type: string, label: "CRM Opportunity ID"}
  - {name: shipping_address, type: text}
  - {name: terms, type: text}
  - {name: notes, type: text}
  - {name: items, type: table, target: SalesOrderItem}

permissions:
  - {role: SalesRep, read: true, write: true, submit: true}
  - {role: SalesManager, read: true, write: true, submit: true, cancel: true}
  - {role: Accountant, read: true}

workflow:
  states: [draft, submitted, processing, partially_delivered, delivered, billed, cancelled]
  transitions:
    - {from: draft, to: submitted, action: submit_so}
    - {from: submitted, to: processing, action: process}
    - {from: processing, to: partially_delivered, action: partial_deliver}
    - {from: processing, to: delivered, action: deliver}
    - {from: partially_delivered, to: delivered, action: deliver}
    - {from: delivered, to: billed, action: mark_billed}
    - {from: draft, to: cancelled, action: cancel_so}
    - {from: submitted, to: cancelled, action: cancel_so}
