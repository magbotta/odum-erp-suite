entity: Quota
app: crm
label: Quota
label_plural: Quotas
description: Sales quota for a rep or team over a time period (§6.3).

fields:
  - name: period
    type: select
    options: [monthly, quarterly, annual]
    default: quarterly
    required: true
    label: Period Type

  - name: period_start
    type: date
    required: true
    label: Period Start

  - name: period_end
    type: date
    required: true
    label: Period End

  - name: target_amount
    type: currency
    required: true
    label: Target Amount

  - name: currency
    type: string
    default: USD
    label: Currency

  - name: notes
    type: text

permissions:
  - role: Sales Manager
    read: true
    write: true
    delete: true

  - role: Admin
    read: true
    write: true
    delete: true
