entity: Territory
app: crm
label: Territory
label_plural: Territories
description: A geographic, vertical, or account-based sales territory (§6.3).

fields:
  - name: name
    type: string
    required: true
    label: Territory Name

  - name: territory_type
    type: select
    options: [geographic, vertical, account]
    default: geographic
    label: Type

  - name: description
    type: text

permissions:
  - role: Sales Manager
    read: true
    write: true
    delete: true

  - role: Admin
    read: true
    write: true
    delete: true
