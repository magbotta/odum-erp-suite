entity: Contact
app: crm
label: Contact
label_plural: Contacts
description: A person linked to an Account in the CRM (§6.3).

fields:
  - name: first_name
    type: string
    required: true
    label: First Name

  - name: last_name
    type: string
    required: true
    label: Last Name

  - name: email
    type: email

  - name: phone
    type: phone

  - name: mobile
    type: phone
    label: Mobile

  - name: title
    type: string
    label: Job Title

  - name: department
    type: string
    label: Department

  - name: lead_source
    type: select
    options: [website, referral, cold_outreach, event, advertisement, other]
    label: Lead Source

  - name: do_not_contact
    type: boolean
    default: false
    label: Do Not Contact

permissions:
  - role: Sales Rep
    read: true
    write: true

  - role: Sales Manager
    read: true
    write: true
    delete: true

  - role: Admin
    read: true
    write: true
    delete: true
