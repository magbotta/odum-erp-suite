entity: Employee
app: hrm
label: Employee
label_plural: Employees
description: Core employee record (§6.4).

fields:
  - name: employee_number
    type: string
    required: true
    unique: true
    label: Employee ID

  - name: first_name
    type: string
    required: true

  - name: last_name
    type: string
    required: true

  - name: email
    type: email
    required: true

  - name: personal_email
    type: email

  - name: phone
    type: phone

  - name: mobile
    type: phone

  - name: designation
    type: string
    label: Job Title

  - name: date_of_joining
    type: date

  - name: date_of_birth
    type: date

  - name: gender
    type: select
    options: [male, female, other, prefer_not_to_say]

  - name: nationality
    type: string

  - name: employment_type
    type: select
    options: [full_time, part_time, contract, intern]
    default: full_time

  - name: status
    type: select
    options: [active, on_leave, probation, resigned, terminated]
    default: active

  - name: notice_period_days
    type: integer
    default: 30

  - name: emergency_contact_name
    type: string

  - name: emergency_contact_phone
    type: phone

  - name: emergency_contact_relation
    type: string

permissions:
  - role: HR Manager
    read: true
    write: true
    delete: true

  - role: Manager
    read: true

  - role: Employee
    read: true
