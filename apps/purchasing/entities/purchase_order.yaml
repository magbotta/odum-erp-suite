entity: PurchaseOrder
app: purchasing
label: Purchase Order
label_plural: Purchase Orders
description: A purchase order issued to a vendor (§6.7).
is_submittable: true

fields:
  - name: po_number
    type: string

  - name: posting_date
    type: date
    required: true

  - name: expected_delivery_date
    type: date

  - name: currency
    type: string
    default: USD

  - name: grand_total
    type: currency
    default: 0

  - name: terms_and_conditions
    type: text

  - name: notes
    type: text

workflow:
  states: [Draft, Submitted, Partially Received, Received, Billed, Cancelled]
  transitions:
    - from: Draft
      to: Submitted
    - from: Submitted
      to: Partially Received
    - from: Submitted
      to: Received
    - from: Partially Received
      to: Received
    - from: Received
      to: Billed
    - from: Draft
      to: Cancelled
    - from: Submitted
      to: Cancelled

permissions:
  - role: Purchase Manager
    read: true
    write: true
    submit: true
    cancel: true

  - role: Accountant
    read: true
