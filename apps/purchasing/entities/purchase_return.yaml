entity: PurchaseReturn
app: purchasing
fields:
  - {name: return_number, type: string, read_only: true}
  - {name: goods_receipt, type: link, target: GoodsReceipt, required: true}
  - {name: vendor_id, type: string, required: true}
  - {name: vendor_name, type: string, required: true}
  - {name: posting_date, type: date, required: true}
  - {name: return_reason, type: text}
  - {name: status, type: select, options: [draft, submitted, cancelled], default: draft}
  - {name: net_total, type: currency, read_only: true}
  - {name: items, type: table, target: PurchaseReturnItem}

permissions:
  - {role: Purchaser, read: true, write: true, submit: true}
  - {role: PurchaseManager, read: true, write: true, submit: true, cancel: true}
  - {role: Accountant, read: true}

workflow:
  states: [draft, submitted, cancelled]
  transitions:
    - {from: draft, to: submitted, action: submit_return}
    - {from: submitted, to: cancelled, action: cancel}
